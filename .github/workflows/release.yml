name: Build

# Every push/PR: run tests and build the zip (downloadable from the run's artifacts).
# Pushing a tag like v1.2.0: also publish it to GitHub Releases, and to CurseForge/Wago
# when their API keys are set as repository secrets.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # create GitHub Releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: tests/run.sh

  package:
    needs: test
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager builds the changelog and version from git history

      - name: Package
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ !startsWith(github.ref, 'refs/tags/') && '-d' || '' }} # -d: build only, don't upload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: .release/*.zip
